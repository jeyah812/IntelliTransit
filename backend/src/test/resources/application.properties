# IntelliTransit Test Configuration
spring.application.name=IntelliTransit-Backend-Test

# H2 In-Memory Database for Unit & Integration Testing
spring.datasource.url=jdbc:h2:mem:intellitransit_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

